name: checks
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: frame
          POSTGRES_PASSWORD: frame_local
          POSTGRES_DB: frame
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U frame -d frame"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Create isolated test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U frame frame_test
      - run: npm test
      - run: npm run db:setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
