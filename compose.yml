services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: frame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frame_local}
      POSTGRES_DB: frame
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - frame_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frame -d frame"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://frame:${POSTGRES_PASSWORD:-frame_local}@db:5432/frame
      APP_ORIGIN: http://localhost:8080
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: development
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-FrameGuest2026!}
      DEMO_RIVAL_PASSWORD: ${DEMO_RIVAL_PASSWORD:-FrameRival2026!}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-FrameAdmin2026!}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:setup && npm run start:api"]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [api]
volumes:
  frame_data:
